<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="152" height="152" rx="33" fill="url(#bg)"/>
  <!-- White heart -->
  <text x="76" y="88.16" 
        font-family="serif" font-size="64" 
        fill="white" text-anchor="middle" dominant-baseline="middle">♥</text>
  <!-- Green leaf accent -->
  <ellipse cx="105.15" cy="105.15" 
           rx="14.840000000000002" ry="7.420000000000001" 
           fill="url(#leaf)" transform="rotate(-45 105.15 105.15)"/>
  <!-- F letter -->
  <text x="74.48" y="87.4" 
        font-family="Arial, sans-serif" font-weight="800" font-size="58" 
        fill="white" fill-opacity="0.18" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>
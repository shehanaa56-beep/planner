<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="96" height="96" rx="21" fill="url(#bg)"/>
  <!-- White heart -->
  <text x="48" y="55.68" 
        font-family="serif" font-size="40" 
        fill="white" text-anchor="middle" dominant-baseline="middle">♥</text>
  <!-- Green leaf accent -->
  <ellipse cx="66.7" cy="66.7" 
           rx="9.520000000000001" ry="4.760000000000001" 
           fill="url(#leaf)" transform="rotate(-45 66.7 66.7)"/>
  <!-- F letter -->
  <text x="47.04" y="55.2" 
        font-family="Arial, sans-serif" font-weight="800" font-size="36" 
        fill="white" fill-opacity="0.18" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="72" height="72" rx="16" fill="url(#bg)"/>
  <!-- White heart -->
  <text x="36" y="41.76" 
        font-family="serif" font-size="30" 
        fill="white" text-anchor="middle" dominant-baseline="middle">♥</text>
  <!-- Green leaf accent -->
  <ellipse cx="49.75" cy="49.75" 
           rx="7.000000000000001" ry="3.5000000000000004" 
           fill="url(#leaf)" transform="rotate(-45 49.75 49.75)"/>
  <!-- F letter -->
  <text x="35.28" y="41.4" 
        font-family="Arial, sans-serif" font-weight="800" font-size="27" 
        fill="white" fill-opacity="0.18" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>
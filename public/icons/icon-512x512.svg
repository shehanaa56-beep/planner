<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <!-- White heart -->
  <text x="256" y="296.96" 
        font-family="serif" font-size="215" 
        fill="white" text-anchor="middle" dominant-baseline="middle">♥</text>
  <!-- Green leaf accent -->
  <ellipse cx="354.45" cy="354.45" 
           rx="50.120000000000005" ry="25.060000000000002" 
           fill="url(#leaf)" transform="rotate(-45 354.45 354.45)"/>
  <!-- F letter -->
  <text x="250.88" y="294.4" 
        font-family="Arial, sans-serif" font-weight="800" font-size="195" 
        fill="white" fill-opacity="0.18" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>